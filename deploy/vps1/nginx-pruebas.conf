# vhost del entorno de PRUEBAS de Hermes — pruebas.hermes.goberna.us
#
#   sudo install -m 0644 deploy/vps1/nginx-pruebas.conf /etc/nginx/sites-available/hermes-pruebas
#   sudo ln -sfn /etc/nginx/sites-available/hermes-pruebas /etc/nginx/sites-enabled/hermes-pruebas
#   sudo nginx -t && sudo systemctl reload nginx
#
# 🔴 EL CANDADO ES EL `listen`, NO UNA CONTRASEÑA. Escucha SOLO en la IP de
#    Tailscale de VPS1 (100.85.119.49). El registro DNS de pruebas.hermes.goberna.us
#    es público y apunta a esa 100.x, que no es ruteable desde internet: quien no
#    está en la tailnet no llega ni al handshake TLS. No hay basic-auth que mantener
#    ni lista de IPs que actualizar.
#    ⚠️ Si alguna vez alguien cambia este `listen` a 0.0.0.0 «para probar desde el
#    celular», el entorno queda abierto CON la copia de producción adentro.
#
# 🔴 REQUIERE `net.ipv4.ip_nonlocal_bind = 1` (ya puesto en
#    /etc/sysctl.d/99-nginx-bind-tailscale.conf). Sin eso, si en un reinicio nginx
#    arranca antes que tailscaled, el bind a la 100.x falla y **nginx no levanta**:
#    un entorno de pruebas se llevaría puesta la API de producción. nginx no declara
#    ninguna dependencia de orden con tailscaled.
#
# El certificado sale por DNS-01 (certbot dns-cloudflare), que es como se emite el de
# hermes-api.goberna.us. Tiene que ser DNS-01 y no HTTP-01: el desafío por HTTP exige
# que Let's Encrypt alcance el puerto 80 desde afuera, y acá justamente no puede.
#
#   sudo certbot certonly --dns-cloudflare \
#     --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#     -d pruebas.hermes.goberna.us

server {
    listen 100.85.119.49:80;
    server_name pruebas.hermes.goberna.us;
    return 301 https://$host$request_uri;
}

server {
    # ⚠️ nginx de VPS1 es 1.18: http2 va como parámetro del `listen`. La forma
    #    `http2 on;` es de 1.25 en adelante y acá tira «unknown directive».
    listen 100.85.119.49:443 ssl http2;
    server_name pruebas.hermes.goberna.us;

    ssl_certificate     /etc/letsencrypt/live/pruebas.hermes.goberna.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pruebas.hermes.goberna.us/privkey.pem;

    # Que no se indexe ni se cachee en ningún lado: acá adentro hay datos de gente real.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Los adjuntos van por el mismo camino que en producción: el server valida el tope
    # por línea y responde 409. 64 MB es el techo de `express.raw`.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:4111;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El SSE de tiempo real (/api/stream) muere si nginx le pone buffer o timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection '';
    }
}
