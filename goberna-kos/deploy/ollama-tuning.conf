# Ollama tuning para geógrafo (RTX A4000, 16 GB).
# Destino: /etc/systemd/system/ollama.service.d/tuning.conf  (reemplaza al vigente)
# Lo aplica deploy-ivi-geografo.sh; requiere sudo y reinicio de ollama.
#
# Por qué cada valor (medido en prod el 2026-07-16, no estimado):
#
# OLLAMA_NUM_PARALLEL=4
#   Estaba en 1: Ollama atendía UNA request por vez y encolaba el resto. Con
#   ~25s de inferencia cada una, el usuario N esperaba ~25×(N-1)s. Medido con
#   5 usuarios concurrentes: 26s / 51s / 77s / 104s / 120s — el último murió
#   por timeout. Con 4 slots los 4 primeros corren juntos y la cola desaparece
#   en el uso real (el equipo no llega a 4 preguntas simultáneas).
#   Costo en VRAM: los pesos (5,2 GB) se comparten entre slots; cada slot suma
#   su propio KV cache de ~0,6 GB con num_ctx=8192 y KV en q8_0.
#   Total ≈ 5,7 + 3×0,6 ≈ 7,5 GB de los 16 GB. Queda ~8,5 GB de margen.
#
# OLLAMA_MAX_LOADED_MODELS=1
#   Se mantiene en 1 A PROPÓSITO. Antes era una trampa: ivi-ventas (:8080) y
#   voz-ivi (:8600, qwen3:14b) usaban modelos DISTINTOS, así que cada uso de uno
#   expulsaba al otro de VRAM y lo obligaba a recargar. Ahora ambos servicios
#   apuntan al mismo modelo (ivi-ventas), así que un solo modelo cargado es
#   justo lo que queremos: sin thrashing y con toda la VRAM para sus slots.
#
# OLLAMA_KEEP_ALIVE=24h
#   Estaba en 5m: el modelo se descargaba tras 5 minutos ociosos. Con un solo
#   modelo no hay nada con qué competir por la VRAM, así que no hay razón para
#   soltarla. (La recarga medida costaba ~2s, o sea que esto no era la causa de
#   la lentitud — pero es gratis evitarla.)
[Service]
Environment=OLLAMA_NUM_PARALLEL=4
Environment=OLLAMA_KEEP_ALIVE=24h
Environment=OLLAMA_MAX_LOADED_MODELS=1
