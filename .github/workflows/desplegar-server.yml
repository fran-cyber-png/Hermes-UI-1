name: Desplegar server (con restart)

# NIVEL 5 — el despliegue que CUESTA algo, y por eso lo dispara una persona.
#
# Reiniciar `hermes` corta el SSE, obliga a whatsmeow a reconectar y —lo que más duele—
# tira las sesiones de Cerberus, que viven en un Map de proceso: cada vendedora logueada
# se encuentra un 409 «la sesión de Cerberus expiró» la próxima vez que abra el formulario
# de venta. Por eso el momento lo elegís vos, idealmente fuera del horario de atención.
#
# El trabajo real NO está acá: está en `deploy/vps1/hermes-deploy.sh`, versionado en el
# repo y revisable en un PR. Este workflow lo instala y lo llama. La misma pieza corre
# cuando alguien despliega por SSH — para que «a mano» y «por pipeline» no puedan
# divergir, que es como se llega a que la vía usada a las 2 AM sea la que nadie probó.
#
# El script respalda la base si hay migraciones, migra, construye, reinicia, espera
# /health, corre el smoke funcional y —si algo falla— revierte solo y verifica que lo
# revertido esté sano. Contexto y decisiones: `docs/despliegue-continuo.md`.

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escribí "reiniciar" para confirmar que las vendedoras pueden perder su sesión de Cerberus'
        required: true
        type: string
      sha:
        description: 'SHA a desplegar (vacío = el HEAD de main)'
        required: false
        type: string
      sin_migrar:
        description: 'NO aplicar migraciones (solo para desenredar algo a mano)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # para dejar rastro si producción se rompe

jobs:
  desplegar:
    name: Desplegar server
    runs-on: [self-hosted, vps1-hermes]
    concurrency:
      group: desplegar-produccion
      cancel-in-progress: false
    steps:
      - name: Verificar la confirmación
        if: inputs.confirmar != 'reiniciar'
        run: |
          echo "::error::Hay que escribir exactamente 'reiniciar' para confirmar."
          exit 1

      - uses: actions/checkout@v4

      # El script se instala DESDE EL REPO en cada corrida: así lo que corre es siempre
      # lo que está commiteado y revisado, y nadie puede parchear el servidor a mano sin
      # que el próximo deploy lo pise.
      - name: Instalar la versión commiteada del script de deploy
        run: sudo install -m 0755 -o root -g root deploy/vps1/hermes-deploy.sh /usr/local/bin/hermes-deploy

      - name: Qué se va a desplegar
        id: plan
        env:
          PEDIDO: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          sudo hermes-deploy ${PEDIDO:-origin/main} --dry-run | tee /tmp/plan.txt
          {
            echo "### Lo que se va a desplegar"
            echo '```'
            cat /tmp/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Desplegar
        id: desplegar
        env:
          PEDIDO: ${{ inputs.sha }}
          SIN_MIGRAR: ${{ inputs.sin_migrar }}
        run: |
          set -euo pipefail
          EXTRA=""
          [ "$SIN_MIGRAR" = "true" ] && EXTRA="--sin-migrar"
          sudo hermes-deploy ${PEDIDO:-origin/main} $EXTRA

      - name: Resumen
        if: success()
        run: |
          {
            echo "## ✅ Server desplegado y verificado"
            echo
            echo "\`/health\` responde y el **smoke funcional** pasó contra la URL pública:"
            echo "el perímetro de auth sigue cerrado y el front nuevo se sirve."
            echo
            echo "Volver atrás (el script sabe a dónde):"
            echo '```bash'
            echo "ssh deploy@161.132.39.165 'sudo hermes-deploy --rollback'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Si el deploy falló, el script YA revirtió y verificó. Lo que falta es que quede
      # rastro: un run rojo en Actions lo ve quien estaba mirando, y nadie más.
      - name: Estado real de producción tras el fallo
        if: failure()
        id: forense
        run: |
          set +e
          {
            echo "### Estado de producción ahora"
            echo
            echo "- \`/health\`: $(curl -fsS --max-time 5 https://hermes-api.goberna.us/health 2>&1 || echo 'SIN RESPUESTA')"
            echo "- servicio: $(systemctl is-active hermes 2>&1)"
            echo "- SHA del checkout: $(git -C /srv/hermes rev-parse --short HEAD 2>&1)"
            echo
            echo "Últimas líneas del log:"
            echo '```'
            sudo journalctl -u hermes -n 30 --no-pager 2>&1 | tail -30
            echo '```'
          } | tee /tmp/forense.md >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir un issue con lo que pasó
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let forense = '(no se pudo recolectar el estado)';
            try { forense = fs.readFileSync('/tmp/forense.md', 'utf8'); } catch {}

            const sha = context.sha.slice(0, 8);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const cuerpo = [
              `El despliegue de \`${sha}\` a producción **falló**.`,
              '',
              `El script revierte solo y verifica lo revertido, así que lo más probable es que`,
              `producción esté en el SHA anterior y respondiendo — pero eso hay que **confirmarlo**,`,
              `no darlo por hecho.`,
              '',
              forense,
              '',
              `**Run:** ${run}`,
              '',
              '---',
              '',
              'Si producción quedó caída:',
              '```bash',
              "ssh deploy@161.132.39.165 'sudo hermes-deploy --rollback'",
              '```',
              '',
              '_Abierto automáticamente por `desplegar-server.yml`._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Falló el despliegue de ${sha} a producción`,
              body: cuerpo,
              labels: ['infra'],
            });
