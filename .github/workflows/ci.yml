name: CI

# EL PIPELINE, EN NIVELES. Cada nivel es más caro que el anterior y solo corre si el
# anterior pasó: lo barato falla primero, así un typo no espera cuatro minutos de tests
# para avisar.
#
#   N1  rápido     secretos · expand-only · journal · server      ~45 s   toda corrida
#   N2  front      lint · typecheck · build · tests del front      ~2 min  toda corrida
#   N2b base       tests con Postgres efímera: el SQL y la PARIDAD ~2 min  toda corrida
#                  del schema (migrar desde cero ≡ src/db/*.ts)
#   N3  staging    despliega a staging + migra + smoke funcional   ~3 min  solo push a main
#   N4  prod front despliega el front a producción, sin restart    ~1 min  solo si N3 pasó
#
# El server en producción NO se despliega acá: reiniciar el proceso le cuesta a cada
# vendedora su sesión de Cerberus, así que lo dispara una persona
# (`desplegar-server.yml`). El reparto está explicado en `docs/despliegue-continuo.md`.
#
# Todo corre en el runner self-hosted de VPS1 (label `vps1-hermes`): no gasta minutos de
# GitHub, y desplegar es escribir en el disco local — sin SSH ni claves.
# OJO: el runner es UNO. Los jobs se serializan aunque el grafo los dibuje en paralelo,
# y cada job extra paga su propio `npm ci`. Por eso los jobs se agrupan por CONJUNTO DE
# DEPENDENCIAS (server / front / base) y no por temática: así son tres `npm ci` y no
# cinco, y de paso los 820 tests del server —que tardan 3 s— caen en el primer nivel.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la corrida vieja: hay un solo runner.
#
# EN `main` NO SE CANCELA, y esto no es un detalle. La corrida de `main` incluye N3 y N4,
# que despliegan — y el `concurrency` de un JOB no protege contra la cancelación del
# WORKFLOW. Con `cancel-in-progress: true`, dos pushes seguidos (un merge y un hotfix)
# pueden matar N4 justo entre `mv dist dist.anterior` y `mv dist.nuevo dist`, dejando
# producción SIN front. En una rama, cancelar solo cuesta minutos de runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ══ NIVEL 1 ══════════════════════════════════════════════════════════════════
  # Las guardias que no necesitan instalar NADA van primero de todo: son segundos y
  # atrapan lo que más caro sale (un secreto versionado, una migración destructiva).
  # Después, con las dependencias del server puestas, todo lo que se apoya en ellas —
  # incluidos los tests puros, que son 820 y tardan 3 s.
  #
  # Por qué los tests del server están en el nivel «rápido» y no en el 2: el runner es
  # UNO y cada job extra paga su propio `npm ci`. Agrupar por costo de dependencias
  # —server acá, front en N2— sale más barato Y falla antes que agrupar por temática.
  n1-rapido:
    name: 'N1 · guardias, server y tests puros'
    runs-on: [self-hosted, vps1-hermes]
    steps:
      - uses: actions/checkout@v4
        with:
          # Historia completa: la guardia expand-only necesita el merge base con `main`,
          # y con el `fetch-depth: 1` por defecto no existe. En el runner self-hosted el
          # workspace persiste, así que después de la primera vez esto es incremental.
          fetch-depth: 0

      # Regla dura #1. `.gitignore` es una intención, no una garantía: un `git add -f`
      # la saltea. Esto mira lo que HAY en el árbol, que es lo que terminaría publicado.
      # Cuesta cero: no instala nada.
      - name: Ningún secreto entró al repo
        run: |
          set -uo pipefail
          MAL=0
          # `.env.example` es lo ÚNICO que puede estar versionado. La regex anterior
          # (`\.env\.[^e]`) dejaba pasar cualquier `.env.<algo-que-empieza-con-e>`:
          # .env.enc, .env.escuela, .env.electoral.
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' ; then
            echo "::error::hay un .env versionado — los secretos van por nombre, nunca en el repo"
            MAL=1
          fi
          # La sesión de WhatsApp es la credencial de la cuenta, no un archivo de config.
          if git ls-files | grep -E '\.wa-sessions/|\.db-wal$|\.db-shm$' ; then
            echo "::error::hay una sesión de WhatsApp versionada — esa es la credencial de la cuenta"
            MAL=1
          fi
          exit $MAL

      # EXPAND-ONLY. Esta guardia es la que hace válido el rollback automático del
      # deploy: si las migraciones solo AGREGAN, el código viejo sigue funcionando
      # contra el schema nuevo, y volver atrás el código no necesita volver atrás la
      # base. Un DROP, un RENAME o un SET NOT NULL rompen esa propiedad — el rollback
      # dejaría al código viejo hablándole a un schema que ya no entiende.
      #
      # Si necesitás borrar o renombrar, van DOS deploys: primero agregás lo nuevo,
      # después de desplegado migrás los datos, y recién en un PR posterior sacás lo
      # viejo. Es más lento y es la única forma de que el rollback siga siendo seguro.
      # NO PUEDE PASAR SIN HABER MIRADO. Antes esto era
      #   NUEVAS="$(git diff … 2>/dev/null || true)"
      # y cualquier fallo de git —un checkout shallow sin merge base, por ejemplo— daba
      # la cadena vacía, que es indistinguible de «no hay migraciones nuevas». La guardia
      # salía verde sin haber abierto un solo archivo. Ahora un fallo de git es un fallo
      # del paso; «no hay migraciones» solo lo dice un `git diff` que corrió bien.
      # El mapa (`docs/mapa.md`) se DERIVA del árbol, y esta guardia hace dos cosas:
      # falla si hay violaciones de `arquitectura.json`, y falla si el mapa commiteado
      # no es idéntico al que se generaría hoy.
      #
      # Lo segundo es lo que impide repetir la historia de `docs/arquitectura.md`, que se
      # escribió a mano el 7-ago-2026 y nueve días después describía un repo 8 veces más
      # chico — sin que nada se pusiera rojo. Un mapa que se escribe envejece en silencio;
      # este no puede, porque mover un archivo sin regenerar pone el CI en rojo.
      #
      # Va temprano y no instala nada: es node puro, sin dependencias.
      - name: El mapa está al día y la arquitectura no tiene violaciones
        run: npm run mapa:verificar

      - name: Las migraciones nuevas son expand-only
        run: |
          set -uo pipefail
          if ! git fetch --quiet origin main; then
            echo "::error::no pude traer origin/main — esta guardia no puede correr"
            exit 1
          fi
          if ! BASE="$(git merge-base FETCH_HEAD HEAD)"; then
            echo "::error::no hay merge base con origin/main (¿checkout shallow?) — esta guardia no puede correr"
            exit 1
          fi

          # Solo las migraciones que ESTE cambio agrega. Las que ya están en main ya se
          # aplicaron: revisarlas otra vez solo daría falsos positivos para siempre.
          # (En un push a `main` la base ES el HEAD, así que no hay nada nuevo que mirar:
          #  el PR ya pasó por acá. Es una guardia de PR, y está bien que lo sea.)
          if ! NUEVAS="$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'server/drizzle/*.sql')"; then
            echo "::error::git diff falló — esta guardia no puede correr"
            exit 1
          fi
          if [ -z "$NUEVAS" ]; then
            echo "sin migraciones nuevas en este cambio (comparado contra ${BASE:0:8})"
            exit 0
          fi

          echo "migraciones nuevas (contra ${BASE:0:8}):"; printf '  %s\n' $NUEVAS
          MAL=0

          # EXCEPCIÓN PUNTUAL (2026-08-02, decidida por el dueño — Estephano). Estas tres
          # migraciones nacieron en una rama (feat/bot-f3) que se desplegó a producción sin
          # pasar por `main`, así que desde el punto de vista de `main` son "nuevas" aunque
          # ya llevan días corriendo. Verificado contra el schema VIVO de VPS1 el 2026-08-02:
          # `bot_followups` no existe (la tabla que 0010 borra), y `bot_respuestas.texto_completo`
          # + `bot_estado_conversacion` + `bot_memoria_lead` sí existen (lo que 0010/0011/0012
          # agregan). El DROP ya pasó, en una base que ya lo tiene asumido — bloquearlo acá no
          # protege ningún rollback real, porque no hay nada que revertir: es `main` poniéndose
          # al día con lo que ya corre. No agregues un archivo a esta lista sin la misma
          # verificación contra la base viva (ver docs/deploy-vps1.md para cómo conectarte).
          EXCEPTUADAS="server/drizzle/0010_clean_ultron.sql server/drizzle/0011_living_hercules.sql server/drizzle/0012_salty_iron_patriot.sql"

          for f in $NUEVAS; do
            if printf '%s\n' $EXCEPTUADAS | grep -qxF "$f"; then
              echo "  $f — exceptuada (ya aplicada en prod, ver comentario arriba)"
              continue
            fi
            # Se ignoran los comentarios: el .sql explica en prosa por qué existe cada
            # línea, y esa prosa nombra justamente las palabras que buscamos.
            #
            # La lista cubre las dos familias: lo que rompe el rollback (DROP de cualquier
            # cosa que el código viejo use, RENAME, SET NOT NULL, ALTER TYPE) y lo que
            # destruye datos sin vuelta (TRUNCATE, DELETE FROM). `UPDATE … SET` queda
            # afuera a propósito: un backfill acotado es legítimo dentro de una migración.
            PELIGROSO="$(grep -vE '^\s*--' "$f" \
              | grep -inE '\b(DROP\s+(TABLE|COLUMN|SCHEMA|CONSTRAINT|INDEX|TYPE|VIEW|DATABASE|DEFAULT)|ALTER\s+COLUMN\s+.*\s+TYPE|SET\s+NOT\s+NULL|RENAME\s+(TO|COLUMN)|TRUNCATE|DELETE\s+FROM)\b' || true)"
            if [ -n "$PELIGROSO" ]; then
              echo "::error file=$f::migración destructiva — el rollback automático deja de ser seguro"
              printf '%s\n' "$PELIGROSO"
              MAL=1
            fi
          done
          exit $MAL

      - name: Dependencias del server
        run: npm ci
        working-directory: server

      # La guardia del journal de migraciones. Va temprano porque es el fallo más caro
      # del repo —drizzle saltea una migración en silencio y el deploy sale verde— y
      # cuesta 200 ms detectarlo. También fija las dos líneas del baseline que
      # drizzle-kit NO emite y que se pierden al regenerarlo: la extensión `vector` y el
      # índice GIN de `notas`.
      - name: Guardia del journal de migraciones
        run: npx tsx --test src/pruebas/journal.test.ts
        working-directory: server

      # Otra cosa que el journal NO mira: que dos ramas no hayan tomado el mismo
      # NÚMERO. `drizzle-kit generate` numera con el máximo local, así que dos
      # ramas paralelas generan las dos la misma — y el choque aparece al
      # mergear la segunda, con el PR ya aprobado. Pasó el 7-ago-2026.
      - name: Ninguna migración pisa un número que ya está en main
        run: |
          git fetch --quiet --depth=1 origin main || true
          npx tsx --test src/pruebas/migracionesSinChoque.test.ts
        working-directory: server

      # Lo que drizzle-kit sabe de sus propios metadatos: que cada snapshot corresponda
      # a su .sql y que no haya colisiones. No toca ninguna base (por eso `client.ts`
      # quedó fuera del glob de `drizzle.config.ts`: exigía un DATABASE_URL para nada).
      - name: El journal y los snapshots de drizzle son coherentes
        run: npm run db:check
        working-directory: server

      - name: Typecheck del server
        run: npx tsc --noEmit
        working-directory: server

      - name: Tests del server (puros)
        run: npm test
        working-directory: server

  # ══ NIVEL 2 ══════════════════════════════════════════════════════════════════
  # El front, con su propio `npm ci` — el paquete de dependencias más caro del repo.
  # Ordenado de barato a caro dentro del job: lint, typecheck, build, tests.
  n2-front:
    name: 'N2 · lint, typecheck, build y tests del front'
    needs: n1-rapido
    runs-on: [self-hosted, vps1-hermes]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del front
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck del front
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Build del front
        run: npm run build

      - name: Tests del front
        run: npm test

      # Informativa a propósito: `npm audit` reporta vulnerabilidades transitivas que a
      # veces no tienen arreglo disponible. Frenar el pipeline por eso enseña a
      # ignorarlo; queda anotado en el resumen y se mira.
      - name: Auditoría de dependencias (informativa)
        continue-on-error: true
        run: |
          {
            echo "### Auditoría de dependencias"
            echo
            echo '```'
            npm audit --audit-level=high 2>&1 | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  n2b-base:
    name: 'N2b · tests con base (el SQL y la paridad del schema)'
    needs: n1-rapido
    runs-on: [self-hosted, vps1-hermes]
    env:
      TEST_DATABASE_URL: postgresql://hermes_test:hermes_test@127.0.0.1:5442/hermes_test
      # El singleton de `db/client.ts` revienta AL IMPORTARSE si `DATABASE_URL` falta —
      # no hace falta usarlo, alcanza con que algún *.test.db.ts lo arrastre en su
      # cadena de imports (ej. reenganche.test.db.ts → correrReenganche.ts →
      # enviarYProyectar.ts). Apunta a la MISMA Postgres efímera de arriba: no se
      # usa de verdad, solo evita el throw al cargar el módulo.
      DATABASE_URL: postgresql://hermes_test:hermes_test@127.0.0.1:5442/hermes_test
    steps:
      - uses: actions/checkout@v4

      # Postgres efímera en 5442 (tmpfs). La guardia anti-prod de `src/pruebas/base.ts`
      # aborta si la URL menciona 5438 (prod), 5434 (dev) o 5440 (staging): el runner
      # vive en la MISMA máquina que las tres — y desde el 16-ago-2026 también 5439
      # (`pse-postgres`, producción de OTRO proyecto que se instaló ahí). Ver ADR 0008.
      - name: Levantar Postgres de test
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Dependencias del server
        run: npm ci
        working-directory: server

      # Además del SQL de la cola y el radar, acá corre la PARIDAD del schema
      # (`migraciones/adopcion.test.db.ts`): migrar desde cero tiene que dar la misma
      # base que declara `src/db/*.ts`. Es lo que hace que un cambio de schema sin su
      # migración NO pueda pasar desapercibido y terminar en un `db:push` a mano.
      - name: Tests con base
        run: npm run test:db
        working-directory: server

      - name: Bajar Postgres de test
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ══ NIVEL 3 — STAGING ════════════════════════════════════════════════════════
  # El primer entorno que EJECUTA el código nuevo. Antes de que existiera, el primero
  # era el de las vendedoras. Acá las migraciones se aplican de verdad, sobre una base
  # CON historia, y corre el smoke funcional autenticado.
  n3-staging:
    name: 'N3 · desplegar a staging y smoke'
    needs: [n2-front, n2b-base]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, vps1-hermes]
    # Staging tiene su propia cola: no comparte candado con producción.
    concurrency:
      group: desplegar-staging
      cancel-in-progress: false
    steps:
      - name: Desplegar el commit a staging
        env:
          SRV: /srv/hermes-staging
          NUEVO: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$SRV"
          git fetch --quiet origin
          git checkout --quiet --force "$NUEVO"

          npm ci --no-audit --no-fund
          (cd server && npm ci --no-audit --no-fund)

          # ANTES de migrar: que lo registrado en la base de staging y lo que el repo
          # dice ser se correspondan. El migrador de drizzle compara por `when`, no por
          # hash, así que una base migrada contra otro baseline no se delata sola — el
          # síntoma sería un «relation already exists» a mitad del .sql, que no explica
          # nada. `db:estado` sí explica, y dice qué hacer.
          #
          # Staging es descartable: si esto falla, la salida trae el comando para
          # recrear la base y volver a migrar (docs/migraciones.md §staging).
          (cd server && npm run db:estado -- --exigir-coherencia)

          # LAS MIGRACIONES, sobre una base que ya tiene datos. Este es el ensayo que
          # antes no existía: `db:push` se corría directo contra producción.
          (cd server && npm run db:migrate)

          # Staging corre `node dist/index.js`, fiel a producción (ver hermes-deploy.sh
          # para el porqué: sin `tsc -b` porque no admite `--outDir`, build aparte y
          # swap atómico).
          (cd server && rm -rf dist.nuevo && npx tsc --outDir dist.nuevo)
          test -f server/dist.nuevo/index.js
          rm -rf server/dist.anterior
          if [ -d server/dist ]; then mv server/dist server/dist.anterior; fi
          mv server/dist.nuevo server/dist

          env VITE_API_URL=http://127.0.0.1:4111 npx vite build --outDir dist.nuevo --emptyOutDir
          test -f dist.nuevo/index.html
          rm -rf dist.anterior
          if [ -d dist ]; then mv dist dist.anterior; fi
          mv dist.nuevo dist

          sudo systemctl restart hermes-staging

      - name: Esperar a que staging levante
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:4111/health >/dev/null 2>&1; then
              echo "staging arriba en ~$((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error::staging no contesta /health después de 60 s"
          sudo journalctl -u hermes-staging -n 40 --no-pager || true
          exit 1

      # El smoke CON SESIÓN: firma un token con el secreto de staging y llega a las
      # rutas de verdad (la cola, el radar, la agenda, el SSE). Sin esto solo se
      # probaría que el portero dice 401.
      - name: Smoke funcional contra staging
        run: BASE_URL=http://127.0.0.1:4111 npm run humo -- --sesion
        working-directory: /srv/hermes-staging/server

      - name: Anotar el resultado
        if: always()
        run: |
          {
            echo "## Nivel 3 · staging"
            echo
            echo "\`${GITHUB_SHA:0:8}\` desplegado en staging (\`:4111\`), migraciones aplicadas"
            echo "y smoke funcional corrido. Producción todavía **no** tiene este código."
          } >> "$GITHUB_STEP_SUMMARY"

  # ══ NIVEL 4 — PRODUCCIÓN (front) ═════════════════════════════════════════════
  # Automático porque no le cuesta nada a nadie: el server lee `dist/` del disco en cada
  # request, así que reemplazarlo actualiza la UI sin reiniciar el proceso — sin cortar
  # el SSE, sin reconectar whatsmeow y sin tirar las sesiones de Cerberus.
  # Ver `docs/despliegue-continuo.md` §2.
  n4-prod-front:
    name: 'N4 · desplegar front a producción'
    needs: n3-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, vps1-hermes]
    # Para que el Resumen pueda decir si DESPLEGÓ o solo decidió no hacerlo: las
    # dos cosas terminan en `success`, y confundirlas costó dos deploys el 7-ago.
    outputs:
      desplegado: ${{ steps.clasificar.outputs.desplegado }}
    # Un despliegue a medio camino NO se cancela.
    concurrency:
      group: desplegar-produccion
      cancel-in-progress: false
    steps:
      - name: Clasificar el cambio y desplegar si es solo front
        id: clasificar
        env:
          SRV: /srv/hermes
          NUEVO: ${{ github.sha }}
          API: https://hermes-api.goberna.us
        run: |
          set -euo pipefail
          ESTADO="$HOME/.hermes-despliegue"   # fuera del checkout: no lo ensucia
          mkdir -p "$ESTADO"

          # 0 · Regla dura #6: ante drift prod≠git, avisar antes de tocar.
          #     `-uno` a propósito: los artefactos sin trackear no son drift.
          if [ -n "$(git -C "$SRV" status --porcelain -uno)" ]; then
            echo "::error::/srv/hermes tiene cambios locales sin commitear. No toco nada."
            git -C "$SRV" status --short -uno
            exit 1
          fi
          git -C "$SRV" fetch --quiet origin main

          # 1 · De qué SHA es el server que está CORRIENDO. No es el del checkout: el
          #     proceso se quedó con el código que había al último restart.
          if [ -f "$ESTADO/server" ]; then
            VIEJO="$(cat "$ESTADO/server")"
          else
            VIEJO="$(git -C "$SRV" rev-parse HEAD)"   # primera corrida
          fi
          echo "server corriendo: $VIEJO"
          echo "a desplegar:      $NUEVO"

          if [ "$VIEJO" = "$NUEVO" ]; then
            echo "Ya estaba desplegado." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 2 · Clasificar sobre TODO el rango sin desplegar, nunca commit por commit:
          #     de a uno, un cambio de front posterior a uno de server se desplegaría
          #     solo y dejaría el front adelante del server.
          # Si este diff falla (un SHA podado, un archivo de estado corrupto), el
          # `|| true` de antes lo convertía en «no cambió nada»: N4 clasificaba un
          # cambio de server como «solo front», desplegaba, y marcaba como corriendo un
          # código de server que nunca se desplegó. Fail-open en la clasificación.
          if ! TOCADOS="$(git -C "$SRV" diff --name-only "$VIEJO".."$NUEVO" 2>&1)"; then
            echo "::error::no pude comparar ${VIEJO:0:8}..${NUEVO:0:8}: $TOCADOS"
            echo "::error::suele ser que el SHA de \$HOME/.hermes-despliegue/server ya no existe. No toco nada."
            exit 1
          fi
          CAMBIO_SERVER="$(printf '%s\n' "$TOCADOS" | grep -E '^server/' || true)"
          CAMBIO_MIGRACION="$(printf '%s\n' "$TOCADOS" | grep -E '^server/drizzle/' || true)"
          CAMBIO_DEPS="$(printf '%s\n' "$TOCADOS" | grep -E '^(package\.json|package-lock\.json)$' || true)"

          if [ -n "$CAMBIO_SERVER" ]; then
            {
              echo "## ⏸ Necesita restart — el front no se desplegó"
              echo
              echo "El rango \`${VIEJO:0:8}..${NUEVO:0:8}\` toca \`server/\`, así que hay que"
              echo "reiniciar el proceso. Eso le cuesta a cada vendedora logueada su sesión de"
              echo "Cerberus, así que **lo decidís vos**: Actions → **Desplegar server (con restart)**."
              echo
              echo "> ✅ Este mismo commit ya pasó por staging (N3): migraciones aplicadas y smoke verde."
              if [ -n "$CAMBIO_MIGRACION" ]; then
                echo ">"
                echo "> 📦 **Trae migraciones.** El despliegue las aplica solo, después de respaldar la base."
              fi
              echo
              echo "Archivos de server tocados:"
              echo '```'
              printf '%s\n' "$CAMBIO_SERVER"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Cambió el server — hace falta el despliegue con restart (botón en Actions)."
            exit 0
          fi

          # 3 · Es solo front: se puede desplegar sin tocar el proceso.
          #
          # A partir de acá SÍ se despliega, y hay que decirlo: el smoke de abajo se
          # gatea con esto. Las dos salidas de arriba (`exit 0`) también son éxito
          # —no desplegar cuando no corresponde es el comportamiento correcto—, así
          # que `if: success()` no alcanza para distinguirlas.
          echo "desplegado=true" >> "$GITHUB_OUTPUT"
          git -C "$SRV" checkout --quiet --force "$NUEVO"
          cd "$SRV"
          if [ -n "$CAMBIO_DEPS" ]; then
            echo "Cambiaron dependencias del front → npm ci"
            npm ci --no-audit --no-fund
          fi

          # Se construye APARTE y se cambia de lugar al final: `vite build` vacía el
          # directorio de salida antes de escribir, y hacerlo sobre `dist/` dejaría a la
          # app sirviendo 404 durante todo el build.
          rm -rf dist.nuevo
          env VITE_API_URL="$API" npx vite build --outDir dist.nuevo --emptyOutDir
          test -f dist.nuevo/index.html
          rm -rf dist.anterior
          # El `if`: en un checkout recién clonado no hay `dist/` todavía, y morir acá
          # dejaría el build hecho y sin publicar. N3 ya lo tenía; esto lo empareja.
          if [ -d dist ]; then mv dist dist.anterior; fi
          mv dist.nuevo dist          # el cambio real: microsegundos

          echo "$NUEVO" > "$ESTADO/server"   # el código de server/ es idéntico: la marca es honesta
          echo "$NUEVO" > "$ESTADO/front"

          # 4 · Regla dura #2: no se dice "listo" sin verificar contra la URL viva.
          # Sin `head`: bajo `pipefail`, `head -1` cierra el pipe y el productor muere con
          # SIGPIPE → el paso falla con 141 y sin mensaje. Y falla DESPUÉS de haber
          # escrito el estado, así que el run rojo miente sobre lo que quedó desplegado.
          # `sed -n '1{p;q}'`... tampoco: mismo problema. Se lee todo y se corta en bash.
          TODOS_SERVIDOS="$(curl -fsS --max-time 20 "$API/" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js')"
          SERVIDO="${TODOS_SERVIDOS%%$'\n'*}"
          TODOS_LOCALES="$(cd dist && ls assets/index-*.js)"
          LOCAL="${TODOS_LOCALES%%$'\n'*}"
          echo "servido: $SERVIDO · construido: $LOCAL"
          if [ "$SERVIDO" != "$LOCAL" ]; then
            echo "::error::El sitio vivo no sirve el build nuevo. Rollback: mv dist dist.roto && mv dist.anterior dist"
            exit 1
          fi

          # 5 · Y que estén los DEMÁS archivos, no solo el bundle.
          #
          # Comparar el hash del `index-*.js` prueba que el bundle nuevo está, y
          # nada más: un asset que falta no lo mueve. El 7-ago-2026 la compresión
          # de video se desplegó SIN sus 32 MB de WebAssembly y el deploy estuvo
          # verde todo el tiempo — el fallback SPA devolvía `index.html` con 200
          # para el archivo que faltaba.
          bash "$SRV/deploy/vps1/verificar-assets.sh" "$API" "$SRV/dist"

          {
            echo "## ✅ Front desplegado sin restart"
            echo
            echo "\`${VIEJO:0:8}\` → \`${NUEVO:0:8}\` · sirviendo \`$SERVIDO\` · **cero downtime**."
            echo
            echo "Rollback (segundos): \`cd /srv/hermes && mv dist dist.roto && mv dist.anterior dist\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # El smoke público contra producción. Sin sesión a propósito: no firma tokens
      # contra la base real. Alcanza para lo que importa acá — que el front nuevo se
      # sirva y que el perímetro de auth siga cerrado ruta por ruta.
      - name: Smoke público contra producción
        # `success()` es cierto también cuando la clasificación decidió NO desplegar
        # —y entonces esto corría `npm run humo` desde el checkout de producción, que
        # todavía es el viejo y puede no tener ni el script—. Falló así la primera vez
        # que el pipeline vio un merge que tocaba `server/`: N4 hizo lo correcto
        # (saltearse) y aun así se puso rojo, que es la peor combinación — un nivel que
        # miente sobre producción enseña a ignorarlo.
        if: steps.clasificar.outputs.desplegado == 'true'
        run: BASE_URL=https://hermes-api.goberna.us npm run humo
        working-directory: /srv/hermes/server

  # ══ RESUMEN ══════════════════════════════════════════════════════════════════
  # Un solo lugar donde ver en qué nivel quedó la corrida, sin abrir job por job.
  resumen:
    name: 'Resumen'
    needs: [n1-rapido, n2-front, n2b-base, n3-staging, n4-prod-front]
    if: always()
    runs-on: [self-hosted, vps1-hermes]
    steps:
      - name: Consolidar
        env:
          R1: ${{ needs.n1-rapido.result }}
          R2: ${{ needs.n2-front.result }}
          R2B: ${{ needs.n2b-base.result }}
          R3: ${{ needs.n3-staging.result }}
          R4: ${{ needs.n4-prod-front.result }}
          DESPLEGO_FRONT: ${{ needs.n4-prod-front.outputs.desplegado }}
        run: |
          set -euo pipefail
          icono() {
            case "$1" in
              success) echo "✅ pasó" ;;
              failure) echo "❌ falló" ;;
              cancelled) echo "⏹ cancelado" ;;
              skipped) echo "⏭ no corrió" ;;
              *) echo "· $1" ;;
            esac
          }
          {
            echo "## Niveles"
            echo
            echo "| Nivel | Qué verifica | Resultado |"
            echo "|---|---|---|"
            echo "| N1 | secretos · expand-only · journal · server | $(icono "$R1") |"
            echo "| N2 | lint · typecheck · build · tests del front | $(icono "$R2") |"
            echo "| N2b | SQL con base + paridad del schema | $(icono "$R2B") |"
            echo "| N3 | staging + migraciones + smoke | $(icono "$R3") |"
            # 🔴 N4 termina en `success` TAMBIEN cuando decide NO desplegar (porque
            # el cambio toca `server/`). No desplegar cuando no corresponde es lo
            # correcto, pero un tilde ahi se lee como «el front salio» — y eso
            # confundio dos deploys seguidos el 7-ago-2026. El estado real sale
            # del output `desplegado` del propio job.
            if [ "$R4" = "success" ] && [ "${DESPLEGO_FRONT:-}" != "true" ]; then
              echo "| N4 | front a producción | ⏭️ **no aplica** (toca server/: va por N5) |"
            else
              echo "| N4 | front a producción | $(icono "$R4") |"
            fi
            echo
            if [ "$R3" = "skipped" ]; then
              echo "> N3 y N4 solo corren al pushear a \`main\`. En un PR, verde hasta N2b es todo lo que hay que mirar."
            fi
            if [ "$R4" = "success" ]; then
              echo "> El **front** ya está en producción. Si el cambio tocaba \`server/\`, el server sigue con el código viejo hasta que dispares **Desplegar server (con restart)**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # El resumen no decide nada: solo refleja. Si un nivel obligatorio falló, la
          # corrida falla — que es lo que mira la protección de rama.
          for r in "$R1" "$R2" "$R2B"; do
            [ "$r" = "success" ] || exit 1
          done
          # N3/N4 pueden estar "skipped" (es un PR); fallados, no.
          for r in "$R3" "$R4"; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
