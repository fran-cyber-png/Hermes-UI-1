name: CI

# EL PIPELINE, EN NIVELES. Cada nivel es más caro que el anterior y solo corre si el
# anterior pasó: lo barato falla primero, así un typo no espera cuatro minutos de tests
# para avisar.
#
#   N1  rápido     lint · typecheck · guardia del journal          ~30 s   toda corrida
#   N2  unidad     build · tests puros · chequeo de secretos       ~2 min  toda corrida
#   N2b base       tests con Postgres efímera (el SQL de verdad)   ~2 min  toda corrida
#   N3  staging    despliega a staging + migra + smoke funcional   ~3 min  solo push a main
#   N4  prod front despliega el front a producción, sin restart    ~1 min  solo si N3 pasó
#
# El server en producción NO se despliega acá: reiniciar el proceso le cuesta a cada
# vendedora su sesión de Cerberus, así que lo dispara una persona
# (`desplegar-server.yml`). El reparto está explicado en `docs/despliegue-continuo.md`.
#
# Todo corre en el runner self-hosted de VPS1 (label `vps1-hermes`): no gasta minutos de
# GitHub, y desplegar es escribir en el disco local — sin SSH ni claves.
# OJO: el runner es UNO. Los jobs se serializan aunque el grafo los dibuje en paralelo;
# por eso están agrupados como están, y no en diez jobs chiquitos.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la corrida vieja: hay un solo runner.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # El binario de Electron son ~100 MB que CI nunca usa: la app de las vendedoras se
  # empaqueta aparte.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  # ══ NIVEL 1 ══════════════════════════════════════════════════════════════════
  # Lo que puede fallar en segundos, falla en segundos. Sin dependencias: es la raíz.
  n1-rapido:
    name: 'N1 · lint, typecheck y journal'
    runs-on: [self-hosted, vps1-hermes]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del front
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck del front
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Dependencias del server
        run: npm ci
        working-directory: server

      - name: Typecheck del server
        run: npx tsc --noEmit
        working-directory: server

      # La guardia del journal de migraciones. Va acá y no con el resto de los tests
      # porque es el fallo más caro del repo —drizzle saltea una migración en silencio
      # y el deploy sale verde— y cuesta 200 ms detectarlo.
      - name: Guardia del journal de migraciones
        run: npx tsx --test src/pruebas/journal.test.ts
        working-directory: server

      # EXPAND-ONLY. Esta guardia es la que hace válido el rollback automático del
      # deploy: si las migraciones solo AGREGAN, el código viejo sigue funcionando
      # contra el schema nuevo, y volver atrás el código no necesita volver atrás la
      # base. Un DROP, un RENAME o un SET NOT NULL rompen esa propiedad — el rollback
      # dejaría al código viejo hablándole a un schema que ya no entiende.
      #
      # Si necesitás borrar o renombrar, van DOS deploys: primero agregás lo nuevo,
      # después de desplegado migrás los datos, y recién en un PR posterior sacás lo
      # viejo. Es más lento y es la única forma de que el rollback siga siendo seguro.
      - name: Las migraciones nuevas son expand-only
        run: |
          set -uo pipefail
          git fetch --quiet --depth=1 origin main 2>/dev/null || true

          # Solo las migraciones que ESTE cambio agrega. Las que ya están en main ya se
          # aplicaron: revisarlas otra vez solo daría falsos positivos para siempre.
          NUEVAS="$(git diff --name-only --diff-filter=A FETCH_HEAD...HEAD -- 'server/drizzle/*.sql' 2>/dev/null || true)"
          if [ -z "$NUEVAS" ]; then
            echo "sin migraciones nuevas en este cambio"
            exit 0
          fi

          echo "migraciones nuevas:"; printf '  %s\n' $NUEVAS
          MAL=0
          for f in $NUEVAS; do
            # Se ignoran los comentarios: el .sql explica en prosa por qué existe cada
            # línea, y esa prosa nombra justamente las palabras que buscamos.
            PELIGROSO="$(grep -vE '^\s*--' "$f" \
              | grep -inE '\b(DROP\s+(TABLE|COLUMN|SCHEMA|CONSTRAINT)|ALTER\s+COLUMN\s+.*\s+TYPE|SET\s+NOT\s+NULL|RENAME\s+(TO|COLUMN))\b' || true)"
            if [ -n "$PELIGROSO" ]; then
              echo "::error file=$f::migración destructiva — el rollback automático deja de ser seguro"
              printf '%s\n' "$PELIGROSO"
              MAL=1
            fi
          done
          exit $MAL

  # ══ NIVEL 2 ══════════════════════════════════════════════════════════════════
  n2-unidad:
    name: 'N2 · build, tests puros y secretos'
    needs: n1-rapido
    runs-on: [self-hosted, vps1-hermes]
    steps:
      - uses: actions/checkout@v4

      # Regla dura #1. `.gitignore` es una intención, no una garantía: un `git add -f`
      # la saltea. Esto mira lo que HAY en el árbol, que es lo que terminaría publicado.
      - name: Ningún secreto entró al repo
        run: |
          set -uo pipefail
          MAL=0
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.[^e]' ; then
            echo "::error::hay un .env versionado — los secretos van por nombre, nunca en el repo"
            MAL=1
          fi
          # La sesión de WhatsApp es la credencial de la cuenta, no un archivo de config.
          if git ls-files | grep -E '\.wa-sessions/|\.db-wal$|\.db-shm$' ; then
            echo "::error::hay una sesión de WhatsApp versionada — esa es la credencial de la cuenta"
            MAL=1
          fi
          exit $MAL

      - name: Dependencias del front
        run: npm ci

      - name: Build del front
        run: npm run build

      - name: Tests del front
        run: npm test

      - name: Dependencias del server
        run: npm ci
        working-directory: server

      - name: Tests del server
        run: npm test
        working-directory: server

      # Informativa a propósito: `npm audit` reporta vulnerabilidades transitivas que a
      # veces no tienen arreglo disponible. Frenar el pipeline por eso enseña a
      # ignorarlo; queda anotado en el resumen y se mira.
      - name: Auditoría de dependencias (informativa)
        continue-on-error: true
        run: |
          {
            echo "### Auditoría de dependencias"
            echo
            echo '```'
            npm audit --audit-level=high 2>&1 | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  n2b-base:
    name: 'N2b · tests con base (el SQL)'
    needs: n1-rapido
    runs-on: [self-hosted, vps1-hermes]
    env:
      TEST_DATABASE_URL: postgresql://hermes_test:hermes_test@127.0.0.1:5439/hermes_test
    steps:
      - uses: actions/checkout@v4

      # Postgres efímera en 5439 (tmpfs). La guardia anti-prod de `src/pruebas/base.ts`
      # aborta si la URL menciona 5438 (prod), 5434 (dev) o 5440 (staging): el runner
      # vive en la MISMA máquina que las tres. Ver ADR 0008.
      - name: Levantar Postgres de test
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Dependencias del server
        run: npm ci
        working-directory: server

      - name: Tests con base
        run: npm run test:db
        working-directory: server

      - name: Bajar Postgres de test
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ══ NIVEL 3 — STAGING ════════════════════════════════════════════════════════
  # El primer entorno que EJECUTA el código nuevo. Antes de que existiera, el primero
  # era el de las vendedoras. Acá las migraciones se aplican de verdad, sobre una base
  # CON historia, y corre el smoke funcional autenticado.
  n3-staging:
    name: 'N3 · desplegar a staging y smoke'
    needs: [n2-unidad, n2b-base]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, vps1-hermes]
    # Staging tiene su propia cola: no comparte candado con producción.
    concurrency:
      group: desplegar-staging
      cancel-in-progress: false
    steps:
      - name: Desplegar el commit a staging
        env:
          SRV: /srv/hermes-staging
          NUEVO: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$SRV"
          git fetch --quiet origin
          git checkout --quiet --force "$NUEVO"

          npm ci --no-audit --no-fund
          (cd server && npm ci --no-audit --no-fund)

          # LAS MIGRACIONES, sobre una base que ya tiene datos. Este es el ensayo que
          # antes no existía: `db:push` se corría directo contra producción.
          (cd server && npm run db:migrate)

          env VITE_API_URL=http://127.0.0.1:4111 npx vite build --outDir dist.nuevo --emptyOutDir
          test -f dist.nuevo/index.html
          rm -rf dist.anterior
          if [ -d dist ]; then mv dist dist.anterior; fi
          mv dist.nuevo dist

          sudo systemctl restart hermes-staging

      - name: Esperar a que staging levante
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:4111/health >/dev/null 2>&1; then
              echo "staging arriba en ~$((i * 2)) s"; exit 0
            fi
            sleep 2
          done
          echo "::error::staging no contesta /health después de 60 s"
          sudo journalctl -u hermes-staging -n 40 --no-pager || true
          exit 1

      # El smoke CON SESIÓN: firma un token con el secreto de staging y llega a las
      # rutas de verdad (la cola, el radar, la agenda, el SSE). Sin esto solo se
      # probaría que el portero dice 401.
      - name: Smoke funcional contra staging
        run: BASE_URL=http://127.0.0.1:4111 npm run humo -- --sesion
        working-directory: /srv/hermes-staging/server

      - name: Anotar el resultado
        if: always()
        run: |
          {
            echo "## Nivel 3 · staging"
            echo
            echo "\`${GITHUB_SHA:0:8}\` desplegado en staging (\`:4111\`), migraciones aplicadas"
            echo "y smoke funcional corrido. Producción todavía **no** tiene este código."
          } >> "$GITHUB_STEP_SUMMARY"

  # ══ NIVEL 4 — PRODUCCIÓN (front) ═════════════════════════════════════════════
  # Automático porque no le cuesta nada a nadie: el server lee `dist/` del disco en cada
  # request, así que reemplazarlo actualiza la UI sin reiniciar el proceso — sin cortar
  # el SSE, sin reconectar whatsmeow y sin tirar las sesiones de Cerberus.
  # Ver `docs/despliegue-continuo.md` §2.
  n4-prod-front:
    name: 'N4 · desplegar front a producción'
    needs: n3-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, vps1-hermes]
    # Un despliegue a medio camino NO se cancela.
    concurrency:
      group: desplegar-produccion
      cancel-in-progress: false
    steps:
      - name: Clasificar el cambio y desplegar si es solo front
        env:
          SRV: /srv/hermes
          NUEVO: ${{ github.sha }}
          API: https://hermes-api.goberna.us
        run: |
          set -euo pipefail
          ESTADO="$HOME/.hermes-despliegue"   # fuera del checkout: no lo ensucia
          mkdir -p "$ESTADO"

          # 0 · Regla dura #6: ante drift prod≠git, avisar antes de tocar.
          #     `-uno` a propósito: los artefactos sin trackear no son drift.
          if [ -n "$(git -C "$SRV" status --porcelain -uno)" ]; then
            echo "::error::/srv/hermes tiene cambios locales sin commitear. No toco nada."
            git -C "$SRV" status --short -uno
            exit 1
          fi
          git -C "$SRV" fetch --quiet origin main

          # 1 · De qué SHA es el server que está CORRIENDO. No es el del checkout: el
          #     proceso se quedó con el código que había al último restart.
          if [ -f "$ESTADO/server" ]; then
            VIEJO="$(cat "$ESTADO/server")"
          else
            VIEJO="$(git -C "$SRV" rev-parse HEAD)"   # primera corrida
          fi
          echo "server corriendo: $VIEJO"
          echo "a desplegar:      $NUEVO"

          if [ "$VIEJO" = "$NUEVO" ]; then
            echo "Ya estaba desplegado." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 2 · Clasificar sobre TODO el rango sin desplegar, nunca commit por commit:
          #     de a uno, un cambio de front posterior a uno de server se desplegaría
          #     solo y dejaría el front adelante del server.
          TOCADOS="$(git -C "$SRV" diff --name-only "$VIEJO".."$NUEVO" || true)"
          CAMBIO_SERVER="$(printf '%s\n' "$TOCADOS" | grep -E '^server/' || true)"
          CAMBIO_MIGRACION="$(printf '%s\n' "$TOCADOS" | grep -E '^server/drizzle/' || true)"
          CAMBIO_DEPS="$(printf '%s\n' "$TOCADOS" | grep -E '^(package\.json|package-lock\.json)$' || true)"

          if [ -n "$CAMBIO_SERVER" ]; then
            {
              echo "## ⏸ Necesita restart — el front no se desplegó"
              echo
              echo "El rango \`${VIEJO:0:8}..${NUEVO:0:8}\` toca \`server/\`, así que hay que"
              echo "reiniciar el proceso. Eso le cuesta a cada vendedora logueada su sesión de"
              echo "Cerberus, así que **lo decidís vos**: Actions → **Desplegar server (con restart)**."
              echo
              echo "> ✅ Este mismo commit ya pasó por staging (N3): migraciones aplicadas y smoke verde."
              if [ -n "$CAMBIO_MIGRACION" ]; then
                echo ">"
                echo "> 📦 **Trae migraciones.** El despliegue las aplica solo, después de respaldar la base."
              fi
              echo
              echo "Archivos de server tocados:"
              echo '```'
              printf '%s\n' "$CAMBIO_SERVER"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Cambió el server — hace falta el despliegue con restart (botón en Actions)."
            exit 0
          fi

          # 3 · Es solo front: se puede desplegar sin tocar el proceso.
          git -C "$SRV" checkout --quiet --force "$NUEVO"
          cd "$SRV"
          if [ -n "$CAMBIO_DEPS" ]; then
            echo "Cambiaron dependencias del front → npm ci"
            npm ci --no-audit --no-fund
          fi

          # Se construye APARTE y se cambia de lugar al final: `vite build` vacía el
          # directorio de salida antes de escribir, y hacerlo sobre `dist/` dejaría a la
          # app sirviendo 404 durante todo el build.
          rm -rf dist.nuevo
          env VITE_API_URL="$API" npx vite build --outDir dist.nuevo --emptyOutDir
          test -f dist.nuevo/index.html
          rm -rf dist.anterior
          mv dist dist.anterior
          mv dist.nuevo dist          # el cambio real: microsegundos

          echo "$NUEVO" > "$ESTADO/server"   # el código de server/ es idéntico: la marca es honesta
          echo "$NUEVO" > "$ESTADO/front"

          # 4 · Regla dura #2: no se dice "listo" sin verificar contra la URL viva.
          SERVIDO="$(curl -fsS --max-time 20 "$API/" | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1)"
          LOCAL="$(ls dist/assets/index-*.js | head -1 | sed 's|dist/||')"
          echo "servido: $SERVIDO · construido: $LOCAL"
          if [ "$SERVIDO" != "$LOCAL" ]; then
            echo "::error::El sitio vivo no sirve el build nuevo. Rollback: mv dist dist.roto && mv dist.anterior dist"
            exit 1
          fi

          {
            echo "## ✅ Front desplegado sin restart"
            echo
            echo "\`${VIEJO:0:8}\` → \`${NUEVO:0:8}\` · sirviendo \`$SERVIDO\` · **cero downtime**."
            echo
            echo "Rollback (segundos): \`cd /srv/hermes && mv dist dist.roto && mv dist.anterior dist\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # El smoke público contra producción. Sin sesión a propósito: no firma tokens
      # contra la base real. Alcanza para lo que importa acá — que el front nuevo se
      # sirva y que el perímetro de auth siga cerrado ruta por ruta.
      - name: Smoke público contra producción
        if: success()
        run: BASE_URL=https://hermes-api.goberna.us npm run humo
        working-directory: /srv/hermes/server

  # ══ RESUMEN ══════════════════════════════════════════════════════════════════
  # Un solo lugar donde ver en qué nivel quedó la corrida, sin abrir job por job.
  resumen:
    name: 'Resumen'
    needs: [n1-rapido, n2-unidad, n2b-base, n3-staging, n4-prod-front]
    if: always()
    runs-on: [self-hosted, vps1-hermes]
    steps:
      - name: Consolidar
        env:
          R1: ${{ needs.n1-rapido.result }}
          R2: ${{ needs.n2-unidad.result }}
          R2B: ${{ needs.n2b-base.result }}
          R3: ${{ needs.n3-staging.result }}
          R4: ${{ needs.n4-prod-front.result }}
        run: |
          set -euo pipefail
          icono() {
            case "$1" in
              success) echo "✅ pasó" ;;
              failure) echo "❌ falló" ;;
              cancelled) echo "⏹ cancelado" ;;
              skipped) echo "⏭ no corrió" ;;
              *) echo "· $1" ;;
            esac
          }
          {
            echo "## Niveles"
            echo
            echo "| Nivel | Qué verifica | Resultado |"
            echo "|---|---|---|"
            echo "| N1 | lint · typecheck · journal | $(icono "$R1") |"
            echo "| N2 | build · tests puros · secretos | $(icono "$R2") |"
            echo "| N2b | tests con base (el SQL) | $(icono "$R2B") |"
            echo "| N3 | staging + migraciones + smoke | $(icono "$R3") |"
            echo "| N4 | front a producción | $(icono "$R4") |"
            echo
            if [ "$R3" = "skipped" ]; then
              echo "> N3 y N4 solo corren al pushear a \`main\`. En un PR, verde hasta N2b es todo lo que hay que mirar."
            fi
            if [ "$R4" = "success" ]; then
              echo "> El **front** ya está en producción. Si el cambio tocaba \`server/\`, el server sigue con el código viejo hasta que dispares **Desplegar server (con restart)**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # El resumen no decide nada: solo refleja. Si un nivel obligatorio falló, la
          # corrida falla — que es lo que mira la protección de rama.
          for r in "$R1" "$R2" "$R2B"; do
            [ "$r" = "success" ] || exit 1
          done
          # N3/N4 pueden estar "skipped" (es un PR); fallados, no.
          for r in "$R3" "$R4"; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
