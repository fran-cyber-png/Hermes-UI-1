name: Instalador Windows (Tauri)

# Tauri no cross-compila: el .exe de Windows se construye en un runner Windows.
# Se dispara a mano (workflow_dispatch) cuando hay que regenerar el instalador —
# que con la UI servida por OTA es casi nunca: solo cuando cambia la cáscara.
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependencias
        run: npm ci

      # 🔴 EL BUILD VA PRIMERO, Y NO ES ORDEN DE GUSTO — ES POR QUÉ NO HAY `.exe`
      # DESDE EL 4-AGO-2026.
      #
      # Los tests estaban acá arriba y fallan con `STATUS_ENTRYPOINT_NOT_FOUND`
      # (`0xc0000139`): el crate COMPILA («Finished `test` profile in 5m 44s») y lo
      # que no arranca es el BINARIO DE TEST, al que le falta `WebView2Loader.dll`
      # al lado. Como el paso cortaba el job, el build nunca se intentaba y las
      # vendedoras —que son las que están en Windows— quedaron clavadas en el
      # instalador del 4-ago, sin forma de recibir ningún cambio de cáscara.
      #
      # Un test roto tiene que costar el test, no el instalador. Ahora el `.exe`
      # sale primero y el fallo de `cargo test` queda VISIBLE (`continue-on-error`
      # marca el paso en rojo sin voltear el job): no se esconde, deja de secuestrar
      # el artefacto.
      - name: Build Tauri (NSIS x64)
        env:
          VITE_API_URL: https://hermes-api.goberna.us
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Los tests de la cáscara (`src-tauri/src/lib.rs`): la guarda de https y
      # —lo que importa— que la UI servida por OTA alcance `abrir_navegador`
      # desde su origen REMOTO. Corren acá y no en `ci.yml` porque ci.yml vive
      # entero en el runner de VPS1, que no tiene Rust ni las libs de sistema de
      # Tauri.
      # ⚠️ ESTO NO ES UN GATE DE PR: este workflow es `workflow_dispatch`. Ver
      # ADR 0040 §«lo que queda debiendo».
      - name: Tests de la cáscara
        continue-on-error: true
        working-directory: src-tauri
        run: cargo test
