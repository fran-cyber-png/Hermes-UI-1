[package]
name = "app"
# Espeja `tauri.conf.json`. Estaban desincronizados (0.1.0 acá, 0.3.0 allá) y no
# molestaba porque el bundle usa el del JSON — pero al buscar «qué versión es
# ésta» hay dos respuestas y una miente.
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 🔴 `unstable` es lo que habilita MULTIWEBVIEW: `Window::add_child`, o sea el
# navegador embebido de ADR 0043. Es la única razón por la que está prendida, y
# conviene saber qué se compró: la API puede cambiar entre menores de Tauri, así
# que subir de versión pide releer `navegador.rs` antes que confiar en el
# `cargo build`. La superficie es chica a propósito (add_child, set_position,
# set_size, hide/show, navigate, reload) y toda pasa por ese módulo.
tauri = { version = "2.11.3", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

# El runtime de mentira de Tauri, SOLO para tests. Es lo que permite invocar
# `abrir_navegador` por el camino real del IPC —con su URL de origen— y así fijar
# que la UI servida por OTA (origen REMOTO) lo alcanza y un sitio cualquiera no.
# Sin esto, esa garantía solo se podía comprobar empaquetando contra producción.
[dev-dependencies]
tauri = { version = "2.11.3", features = ["test", "unstable"] }
