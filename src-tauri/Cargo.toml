[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

# El runtime de mentira de Tauri, SOLO para tests. Es lo que permite invocar
# `abrir_navegador` por el camino real del IPC —con su URL de origen— y así fijar
# que la UI servida por OTA (origen REMOTO) lo alcanza y un sitio cualquiera no.
# Sin esto, esa garantía solo se podía comprobar empaquetando contra producción.
[dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
