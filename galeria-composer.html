    <style>
      /* ⚠️ Acá había un `* { margin: 0; padding: 0 }` y por eso las capturas de
         este hilo salían con las burbujas SIN fondo ni padding — evidencia de una
         UI que la vendedora no ve nunca. Tailwind 4 emite sus utilidades dentro de
         `@layer`, y una regla SIN capa le gana a una con capa aunque tenga menos
         especificidad: ese reset se comía todos los `p-*` y `gap-*` del hilo. */
      body { font-family: 'Open Sans', system-ui, sans-serif; background: #f1f5f9; }
      #galeria { display: flex; justify-content: center; }
    </style>
